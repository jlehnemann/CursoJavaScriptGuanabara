<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <section>
        <div id="form">
            <p>Ano de Nascimento:
                <input type="text" name="txtano" id="txtano">
            </p>
             
            <p>Sexo: 
                <label for="masc">Masculino</label>
                <input type="radio" name="radsex" id="masc" value="masculino" checked>

                <label for="femi">Feminino</label>
                <input type="radio" name="radsex" id="femi" value="feminino">
            </p>

            <p>
                <input type="button" value="Verificar" onclick="verificar()">
            </p> 
        </div>
        <div id="res">
            Preencha os dados acima para ver o resultado!
        </div>
    </section>
    <footer>
        <p>&copy; Curso em vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
